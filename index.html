<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Block Defense 3D</title>
<style>
  :root{--bg:#11151c;--panel:#1b2230;--card:#232c3c;--text:#f5f7fb;--muted:#aeb8c8;--border:#364256;--accent:#4f8cff;--accent2:#2b5dcc;}
  *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0f131a,#151b25);color:var(--text)}
  .wrap{max-width:1200px;margin:0 auto;padding:14px}.chip,.btn,.pick,.panel,.check{border:1px solid var(--border);background:#182131e8;backdrop-filter:blur(5px);border-radius:10px}.btn{color:var(--text);padding:8px 11px;font-weight:800;cursor:pointer}.btn.primary{background:#4f8cffeb;border-color:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.chip{padding:8px 10px;font-weight:800}.check{display:flex;align-items:center;gap:7px;padding:7px 9px;font-weight:800}.gamebox{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:#0d1117}.gamebox canvas{display:block;width:100%;height:auto;touch-action:none}.top{position:absolute;z-index:20;left:10px;right:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;pointer-events:none}.stats,.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:auto}.hint{position:absolute;z-index:15;left:10px;top:62px;background:#000a;padding:6px 8px;border-radius:8px;font-size:11px;pointer-events:none;max-width:74%}.inf{position:absolute;z-index:20;left:10px;bottom:138px;background:#000c}.skip-btn{position:absolute;z-index:20;left:10px;bottom:96px;background:#000c}.boss-ui{position:absolute;z-index:19;left:50%;top:95px;transform:translateX(-50%);width:min(560px,68%);display:none;pointer-events:none}.boss-name{text-align:center;font-weight:900;font-size:15px;text-shadow:0 2px 4px #000;margin-bottom:5px}.boss-track{height:20px;background:#240d14;border:2px solid #f3d6dc;border-radius:999px;overflow:hidden;box-shadow:0 2px 7px #0008}.boss-fill{height:100%;width:100%;background:linear-gradient(90deg,#b51635,#ff4f6f);transition:width .12s linear}.boss-hp{text-align:center;font-size:12px;font-weight:800;margin-top:3px;text-shadow:0 1px 3px #000}.tooltip{position:absolute;z-index:30;display:none;background:#000e;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700;pointer-events:none}.panel{position:absolute;z-index:2   @media (max-width:900px){.panel{width:190px;top:128px}.towerbar{grid-template-columns:repeat(3,1fr)}.hint{top:96px;max-width:58%}.boss-ui{top:135px}.msg{bottom:142px}.inf{bottom:204px}.skip-btn{bottom:162px}}
</style>
</head>
<body>
<div class="wrap" id="app" tabindex="0">
  <div class="gamebox">
    <canvas id="canvas" width="900" height="520"></canvas>

    <div class="top">
      <div class="stats">
        <div class="chip">💵 $<span id="money">500</span></div>
        <div class="chip">❤️ <span id="lives">100</span></div>
        <div class="chip">🌊 <span id="wave">0</span>/<span id="maxWave">25</span></div>
      </div>
      <div class="actions">
        <label class="check"><input id="auto" type="checkbox"> Auto Next</label>
        <label class="check"><input id="autoskip" type="checkbox"> Auto Skip</label>
        <label class="check">🎮 <select id="difficulty" style="background:#182131;color:#fff;border:1px solid #46536a;border-radius:7px;padding:3px 5px;font-weight:800"><option value="easy">Easy • 25</option><option value="medium">Medium • 30</option><option value="hard">Hard • 40</option></select></label>
        <label class="check">⏩ <select id="speed" style="background:#182131;color:#fff;border:1px solid #46536a;border-radius:7px;padding:3px 5px;font-weight:800"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label>
        <button id="start" class="btn primary">▶ Wave</button>
        <button id="follow" class="btn">👤 Follow: ON</button>
        <button id="fp" class="btn">🎥 FP: OFF</button>
        <button id="reset" class="btn">↻</button>
      </div>
    </div>

    <div class="hint">WASD move • Space jump • Shift sprint • E place • F first person • Click tower • Hover HP • Drag rotate • Wheel zoom</div>
    <div id="bossUI" class="boss-ui"><div id="bossName" class="boss-name">BOSS</div><div class="boss-track"><div id="bossFill" class="boss-fill"></div></div><div id="bossHP" class="boss-hp"></div></div>
    <div id="enemyTip" class="tooltip"></div>
    <button id="inf" class="btn inf">💸 Infinite Money: OFF</button>
    <button id="skip" class="btn skip-btn" disabled>⏭ Skip • 12s</button>

    <div class="panel">
      <h3>🛠 Tower Upgrade</h3>
      <div id="towerName" style="font-size:18px;font-weight:800">No tower selected</div>
      <div id="towerStats" class="muted" style="margin-top:7px">Click a tower to inspect it.</div>
      <button id="upgrade" class="btn primary full" disabled>⬆ Upgrade</button>
      <button id="sell" class="btn full" disabled>💰 Sell</button>
    </div>

    <div class="towerbar">
      <button data-type="scout" class="pick active"><b>⚡ TheX</b><br>$150</button>
      <button data-type="heavy" class="pick"><b>🐶 Cake Spawner</b><br>$275 • Spawner</button>
      <button data-type="goldcake" class="pick"><b>✨ Golden Cake</b><br>$650 • Healer</button>
      <button data-type="ranger" class="pick"><b>🎯 Ranger</b><br>$350</button>
      <button data-type="hero" class="pick"><b>⚔️ Ryaninft11</b><br>$425 • Melee</button>
    </div>
    <div id="msg" class="msg">⚔️ Ryaninft11 is a close-range melee tower.</div>
  </div>
</div>

  updateSkipButton();
  // Player movement relative to the camera angle
  let mx=0,mz=0;if(moveKeys.w||moveKeys.arrowup)mz-=1;if(moveKeys.s||moveKeys.arrowdown)mz+=1;if(moveKeys.a||moveKeys.arrowleft)mx-=1;if(moveKeys.d||moveKeys.arrowright)mx+=1;
  const moving=mx!==0||mz!==0;
  if(moving){const len=Math.hypot(mx,mz);mx/=len;mz/=len;const speed=(moveKeys.shift?7.2:4.5)*dt;const sy=Math.sin(yaw),cy=Math.cos(yaw);const wx=mx*cy+mz*sy,wz=-mx*sy+mz*cy;player.position.x=Math.max(-11.3,Math.min(11.3,player.position.x+wx*speed));player.position.z=Math.max(-7.3,Math.min(7.3,player.position.z+wz*speed));player.rotation.y=Math.atan2(wx,wz);playerWalk+=dt*(moveKeys.shift?13:9);const swing=Math.sin(playerWalk)*.7;playerLeftArm.rotation.x=swing;playerRightArm.rotation.x=-swing;playerLeftLeg.rotation.x=-swing;playerRightLeg.rotation.x=swing}else{playerLeftArm.rotation.x*=.8;playerRightArm.rotation.x*=.8;playerLeftLeg.rotation.x*=.8;playerRightLeg.rotation.x*=.8}
  if(!playerGrounded||player.position.y>0){playerVelY-=15.5*dt;player.position.y+=playerVelY*dt;if(player.position.y<=0){player.position.y=0;playerVelY=0;playerGrounded=true}}
  if(firstPerson){cam()}else if(followPlayer){camTarget.lerp(new THREE.Vector3(player.position.x,player.position.y+1,player.position.z),Math.min(1,dt*6));cam()}
  if(running&&spawnQueue.length){spawnClock-=gameDt;if(spawnClock<=0){spawnEnemy(spawnQueue.shift());spawnClock=.65}}
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i],p=path[e.seg+1];
    if(!p){scene.remove(e.g);enemies.splice(i,1);lives=Math.max(0,lives-e.damage);hud();updateBossBar();continue}
    const dx=p[0]-e.g.position.x,dz=p[1]-e.g.position.z,d=Math.hypot(dx,dz),step=e.speed*gameDt;
    if(d>0.0001)e.g.rotation.y=Math.atan2(dx,dz);
    e.walk+=gameDt*(5.5+e.speed*1.7);
    const swing=Math.sin(e.walk)*((e.type==='heavy'||e.isBoss)?.48:.72);
    e.leftArm.rotation.x=swing;e.rightArm.rotation.x=-swing;
    e.leftLeg.rotation.x=-swing;e.rightLeg.rotation.x=swing;
    e.g.position.y=Math.abs(Math.sin(e.walk*2))*.035*e.scale;if(e.isBoss||e.singleStun){e.stunClock-=gameDt;if(e.stunClock<=0){if(e.singleStun)gunnerStun(e);else bossStun(e);e.stunClock=e.stunEvery}}
    if(step>=d){e.g.position.x=p[0];e.g.position.z=p[1];e.seg++}
    else{e.g.position.x+=dx/d*step;e.g.position.z+=dz/d*step}
  }
  for(const t of towers){
    if((t.stun||0)>0){t.stun-=gameDt;continue}
    if(t.type==='heavy'||t.type==='goldcake'){const s=stat(t);t.spawnClock-=gameDt;const owned=dogs.filter(d=>d.owner===t).length;const cap=t.type==='goldcake'?6:5;if(t.spawnClock<=0&&owned<cap&&running){spawnDog(t);t.spawnClock=s.rate}continue}
    if(t.type==='hero'&&t.armPivot){if(t.swing>0){t.swing-=gameDt;const progress=1-Math.max(0,t.swing)/.34;const arc=Math.sin(progress*Math.PI);t.armPivot.rotation.x=-.2-arc*1.35;t.armPivot.rotation.z=-.28-arc*.45}else{t.armPivot.rotation.x=-.2;t.armPivot.rotation.z=-.28}}
    t.cool-=gameDt;if(t.cool>0)continue;const s=stat(t);let target=null,bestProgress=-Infinity;
    for(const e of enemies){
      const d=Math.hypot(e.g.position.x-t.g.position.x,e.g.position.z-t.g.position.z);
      if(d>=s.range)continue;
      const a=path[e.seg],b=path[e.seg+1];
      let segmentProgress=0;
      if(a&&b){
        const segLen=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
        const traveled=Math.hypot(e.g.position.x-a[0],e.g.position.z-a[1]);
        segmentProgress=Math.max(0,Math.min(1,traveled/segLen));
      }
      const progress=e.seg+segmentProgress;
      if(progress>bestProgress){target=e;bestProgress=progress}
    }
    if(target){const dx=target.g.position.x-t.g.position.x,dz=target.g.position.z-t.g.position.z;t.aim.rotation.y=Math.atan2(-dx,-dz);t.cool=s.rate;if(t.type==='scout'){beam(t,target);hurt(target,s.dmg)}else if(t.type==='hero'){t.swing=.34;hurt(target,s.dmg)}else{projectile(t,target);hurt(target,s.dmg)}}
    // Evolved TheX minigun is an independent weapon with its own target and cooldown.
    if(t.type==='scout'&&t.evolved&&t.minigunMuzzle){
      t.minigunCool-=gameDt;
      if(t.minigunCool<=0){
        let mgTarget=null,mgProgress=-1;
        for(const e of enemies){
          const dist=Math.hypot(e.g.position.x-t.g.position.x,e.g.position.z-t.g.position.z);if(dist>t.minigunRange)continue;
          const a=path[e.seg],b=path[e.seg+1];let part=0;if(a&&b){const sl=Math.hypot(b[0]-a[0],b[1]-a[1])||1;part=Math.max(0,Math.min(1,Math.hypot(e.g.position.x-a[0],e.g.position.z-a[1])/sl))}
          const prog=e.seg+part;if(prog>mgProgress){mgProgress=prog;mgTarget=e}
        }
        if(mgTarget){
          const wp=new THREE.Vector3();t.minigunMuzzle.getWorldPosition(wp);
          laserFrom(wp,mgTarget,0x75f7ff,.028,.055);
          const flash=new THREE.Mesh(new THREE.SphereGeometry(.065,8,6),new THREE.MeshBasicMaterial({color:0xa6fbff}));flash.position.copy(wp);scene.add(flash);effects.push({m:flash,life:.035});
          hurt(mgTarget,t.minigunDamage);t.minigunCool=t.minigunRate;
        }
      }
    }
  }
  for(let i=dogs.length-1;i>=0;i--){
    const d=dogs[i];if(!towers.includes(d.owner)){removeDog(d);continue}const s=stat(d.owner);d.bite-=gameDt;d.collisionClock-=gameDt;
    let target=null,best=999;for(const e of enemies){const dist=Math.hypot(e.g.position.x-d.g.position.x,e.g.position.z-d.g.position.z);if(dist<.8&&dist<best){target=e;best=dist}}
    if(target){
      const dx=target.g.position.x-d.g.position.x,dz=target.g.position.z-d.g.position.z;d.g.rotation.y=Math.atan2(dz,-dx);

      // Collision damage is separate from Bubbles' bite/heal cooldown.
      // Any enemy touching Bubbles hurts it immediately, then again every 0.45s while contact continues.
      if(d.collisionClock<=0){
        d.hp-=Math.max(1,target.collision||1);
        d.collisionClock=.45;
        if(d.hp<=0){removeDog(d);continue}
      }

      if(d.bite<=0){
        if(d.healer){target.hp=Math.min(target.max,target.hp+s.dmg);if(target.isBoss)updateBossBar()}
        else{hurt(target,s.dmg)}
        d.bite=.65;
      }
    }
    else if(d.seg>0){const p=path[d.seg-1],dx=p[0]-d.g.position.x,dz=p[1]-d.g.position.z,dist=Math.hypot(dx,dz),step=3.4*gameDt;d.g.rotation.y=Math.atan2(dz,-dx);d.walk+=gameDt*10;d.g.position.y=Math.abs(Math.sin(d.walk))*.025;const ds=Math.sin(d.walk)*.55;d.legs.forEach((leg,j)=>leg.rotation.z=(j%2?ds:-ds));if(step>=dist){d.g.position.x=p[0];d.g.position.z=p[1];d.seg--}else if(dist>.001){d.g.position.x+=dx/dist*step;d.g.position.z+=dz/dist*step}}
    else{removeDog(d)}
  }
  for(let i=effects.length-1;i>=0;i--){const f=effects[i];f.life-=gameDt;if(f.fade&&f.m.material)f.m.material.opacity=Math.max(0,Math.min(.28,f.life/.45*.28));if(f.target&&scene.children.includes(f.target.g))f.m.position.lerp(new THREE.Vector3(f.target.g.position.x,1,f.target.g.position.z),Math.min(1,gameDt*18));if(f.life<=0){scene.remove(f.m);effects.splice(i,1)}}
  updateBossBar();
  // Auto Skip waits 12 seconds from the start of each wave before advancing.
  if(running&&document.getElementById('autoskip').checked&&waveElapsed>=12&&wave<maxWaves){skipWave(true)}
  if(running&&spawnQueue.length===0&&enemies.length===0){running=false;if(!infinite)money+=100+wave*18;hud();if(wave>=maxWaves){finished=true;msg.textContent=`🏆 WAVE ${maxWaves} CLEARED — YOU WIN!`}else{msg.textContent=`🏆 Wave ${wave} cleared!`;if(document.getElementById('auto').checked)autoTimer=2}}
  if(!running&&!finished&&autoTimer>0){autoTimer-=gameDt;if(autoTimer<=0&&document.getElementById('auto').checked)startWave()}if(lives<=0){running=false;autoTimer=0;autoSkipTimer=0;msg.textContent=`💀 Base destroyed on Wave ${wave}.`}
}
function resize(){const r=canvas.getBoundingClientRect(),w=Math.max(320,Math.round(r.width)),h=Math.round(w*.58);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function loop(now){resize();const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}hud();updateSkipButton();root.focus();requestAnimationFrame(loop);
</script>
